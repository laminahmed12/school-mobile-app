name: lamin_school
description: "لامين لإدارة وتنظيم المدارس - Adreemk"
publish_to: "none"
version: 2.0.1+10
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_picker: ^10.3.6
  google_sign_in: ^7.2.0
  http: ^1.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.1
dependency_overrides:
  # Avoid the Android Pigeon/Kotlin API mismatch seen with shared_preferences_android 2.5.0.
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
