name: Lamin development validation
on:
  push:
    branches:
      - development/lamin-after-obour-2026-10-28
  pull_request:
    branches:
      - main
      - development/lamin-after-obour-2026-10-28
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Automated tests
        run: flutter test --no-pub
      - name: Prepare Android platform files for CI
        run: |
          flutter create --project-name lamin_school --org com.adreemk.school --platforms android .
          rm -f test/widget_test.dart
      - name: Build Android candidate (unsigned)
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: lamin-development-candidate
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
