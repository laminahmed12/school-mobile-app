name: Lamin development validation
on:
  push:
    branches:
      - development/lamin-after-obour-2026-10-28
      - fix/lamin-portal-crud-offline-20261030
  pull_request:
    branches:
      - main
      - development/lamin-after-obour-2026-10-28
      - feature/lamin-desktop-portal-2026-10-29
permissions:
  contents: read

concurrency:
  group: lamin-development-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Automated tests
        run: flutter test --no-pub
      - name: Prepare Android platform files and Lamin identity
        run: |
          flutter create --project-name lamin_school --org com.adreemk.school --platforms android .
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/res/values/lamin_launcher.xml <<'EOF'
          <resources>
              <color name="lamin_launcher_background">#0B3D32</color>
          </resources>
          EOF
          cat > android/app/src/main/res/drawable/ic_lamin_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD7B45C"
                  android:pathData="M54,13 C40,31 28,31 22,44 L31,44 C37,34 46,33 54,24 C62,33 71,34 77,44 L86,44 C80,31 68,31 54,13 Z"/>
              <path android:fillColor="#FFD7B45C"
                  android:pathData="M54,31 L60,43 L73,48 L60,53 L54,66 L48,53 L35,48 L48,43 Z"/>
              <path android:fillColor="#FFFFF5DE"
                  android:pathData="M14,51 L48,62 C51,63 53,66 54,69 C55,66 57,63 60,62 L94,51 L94,81 L60,91 C57,92 55,94 54,96 C53,94 51,92 48,91 L14,81 Z"/>
              <path android:fillColor="#FF0B3D32"
                  android:pathData="M18,56 L46,65 C49,66 51,68 52,72 L52,88 C50,85 48,84 45,83 L18,75 Z"/>
              <path android:fillColor="#FF0B3D32"
                  android:pathData="M90,56 L62,65 C59,66 57,68 56,72 L56,88 C58,85 60,84 63,83 L90,75 Z"/>
              <path android:fillColor="#FFD7B45C"
                  android:pathData="M14,83 L46,92 C50,93 52,96 54,99 C56,96 58,93 62,92 L94,83 L94,88 L62,98 C58,99 56,101 54,103 C52,101 50,99 46,98 L14,88 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/lamin_launcher_background"/>
              <foreground android:drawable="@drawable/ic_lamin_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/lamin_launcher_background"/>
              <foreground android:drawable="@drawable/ic_lamin_launcher_foreground"/>
          </adaptive-icon>
          EOF
          sed -i 's/android:label="[^"]*"/android:label="لامين"/' android/app/src/main/AndroidManifest.xml
      - name: Build Android candidate (debug-signed for testing)
        env:
          GOOGLE_SERVER_CLIENT_ID: 207834913386-6tc5895vtjbsae2ie4va4g8rk84c8qq0.apps.googleusercontent.com
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Verify candidate APK signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.adreemk.school.lamin_school' versionCode='12' versionName='2.0.3'" <<< "$BADGING"
          sha256sum "$APK" | tee "$RUNNER_TEMP/lamin-candidate-sha256.txt"
      - name: Package Android signing toolchain for release signing
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          mkdir -p "$RUNNER_TEMP/apksigner-tools"
          cp "$BUILD_TOOLS_DIR/apksigner" "$RUNNER_TEMP/apksigner-tools/"
          cp -a "$BUILD_TOOLS_DIR/lib" "$RUNNER_TEMP/apksigner-tools/"
          tar -czf "$RUNNER_TEMP/apksigner-tools.tar.gz" -C "$RUNNER_TEMP" apksigner-tools
      - name: Upload Android signing toolchain
        uses: actions/upload-artifact@v4
        with:
          name: lamin-apksigner-toolchain
          path: ${{ runner.temp }}/apksigner-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload candidate APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: lamin-development-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/lamin-candidate-sha256.txt
          if-no-files-found: error
          retention-days: 7
