name: Lamin Analysis Only

on:
  push:
    branches:
      - plan/lamin-finance-rollover-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Format, analyze, and test (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib
      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests (when test directory exists)
        run: |
          if [ -d test ]; then
            flutter test --no-pub
          else
            echo 'No test/ directory in this repository yet; skipping tests.'
          fi
