name: Lamin Analysis Only

on:
  push:
    branches:
      - work/lamin-release-readiness-20261014
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Format, analyze, and test (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
      - name: Resolve dependencies
        id: dependencies
        run: flutter pub get
      - name: Verify Dart formatting without modifying the checkout
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests even when static analysis reports issues
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter test --no-pub
