name: Lamin DB baseline reconstruction experiment (continuation)

on:
  push:
    branches:
      - experiment/lamin-db-baseline-reconstruction-20261014-continuation
    paths:
      - '.github/workflows/lamin-db-reconstruction-continuation.yml'
      - 'supabase/migrations/**'
      - 'test/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-baseline-gate:
    name: Isolated PostgreSQL baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamin_test
          POSTGRES_PASSWORD: lamin_test_only
          POSTGRES_DB: lamin_reconstruction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamin_test -d lamin_reconstruction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: lamin_test
      PGPASSWORD: lamin_test_only
      PGDATABASE: lamin_reconstruction_test
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify disposable empty database
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc 'SELECT version();' | tee postgres-version.txt
          count="$(psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema');")"
          echo "$count" | tee user-table-count.txt
          test "$count" = "0"

      - name: Inventory source files and require historical sources
        shell: bash
        run: |
          set -euo pipefail
          baseline='supabase/migrations/20260924214051_001_core_tables.sql'
          bootstrap='test/sql/supabase_test_bootstrap.sql'
          {
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Baseline present: $([ -f "$baseline" ] && echo yes || echo no)"
            echo "Bootstrap present: $([ -f "$bootstrap" ] && echo yes || echo no)"
            echo "Migration file count: $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
            echo "Migration inventory:"
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          } | tee reconstruction-gate-evidence.txt
          if [ ! -f "$baseline" ] || [ ! -f "$bootstrap" ]; then
            echo "::error::Historical migration chain cannot be executed: original baseline and/or test bootstrap is missing. No SQL has been synthesized."
            exit 1
          fi
          echo "::error::Source files exist, but replay remains blocked until provenance review is recorded."
          exit 1

      - name: Apply chain only after source and provenance gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f test/sql/supabase_test_bootstrap.sql
          while IFS= read -r file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamin-db-reconstruction-continuation-evidence
          path: |
            postgres-version.txt
            user-table-count.txt
            reconstruction-gate-evidence.txt
          if-no-files-found: warn
          retention-days: 30
