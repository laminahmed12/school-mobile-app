name: Lamin web portal validation
on:
  push:
    branches:
      - feature/lamin-desktop-portal-2026-10-29
  pull_request:
    branches:
      - development/lamin-after-obour-2026-10-28
permissions:
  contents: read
concurrency:
  group: lamin-web-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check required portal assets and security boundaries
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/README.md
          test -s web/SECURITY.md
          ! grep -R -nE 'service[_-]?role|SUPABASE_SERVICE_ROLE_KEY' web/
          grep -q 'restore_backup' web/app.js
          grep -q 'school_filter' web/app.js
          grep -q 'auth-login' web/app.js
          grep -q 'attendance' web/index.html
          grep -q 'student_fee_assessments' web/app.js
          grep -q 'audit_log' web/app.js
          grep -q 'panel-settings' web/index.html
