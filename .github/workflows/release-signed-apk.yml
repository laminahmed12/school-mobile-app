name: Build signed Lamin release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lamin-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LAMIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAMIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAMIN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing LAMIN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing LAMIN_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing LAMIN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing LAMIN_KEY_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --project-name lamin_school --org com.adreemk.school --platforms android .

      - name: Apply Lamin Android identity
        shell: bash
        run: |
          sed -i 's/android:label="[^"]*"/android:label="لامين"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          cat > android/app/src/main/kotlin/com/adreemk/school/lamin_school/MainActivity.kt <<'EOF'
          package com.adreemk.school.lamin_school
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity : FlutterFragmentActivity()
          EOF

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LAMIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAMIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAMIN_KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lamin-release.jks"
          test -s "$RUNNER_TEMP/lamin-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lamin-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/lamin-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'signingConfigs.create("release")' in s:
              raise SystemExit("Release signing config already exists; refusing duplicate injection")
          marker = "android {"
          if marker not in s:
              raise SystemExit("Could not find android block")
          s = s.replace(marker, '''android {
              signingConfigs {
                  create("release") {
                      val props = java.util.Properties()
                      val propsFile = rootProject.file("key.properties")
                      propsFile.inputStream().use { props.load(it) }
                      storeFile = file(props.getProperty("storeFile"))
                      storePassword = props.getProperty("storePassword")
                      keyAlias = props.getProperty("keyAlias")
                      keyPassword = props.getProperty("keyPassword")
                  }
              }''', 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          if old not in s:
              raise SystemExit("Expected Flutter release debug-signing default was not found")
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          PY
          rm -f android/key.properties
          # Recreate properties only during Gradle execution; keep secrets out of the repository.
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/lamin-release.jks
          EOF

      - name: Resolve dependencies and run tests
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Validate Google Drive OAuth configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_SERVER_CLIENT_ID" || { echo "::error::Missing repository variable GOOGLE_SERVER_CLIENT_ID. Set it to the Web application OAuth client ID; otherwise Google Drive backup cannot work."; exit 1; }

      - name: Build signed release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify APK signature and certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LAMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAMIN_KEY_ALIAS }}
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
          keytool -list -v -keystore "$RUNNER_TEMP/lamin-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA256:|SHA-256:'

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: lamin-signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/apk-sha256.txt
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/lamin-release.jks"
