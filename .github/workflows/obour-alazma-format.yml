name: Format and validate Lamin recovery branch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
pull_request:
  branches: [main]
jobs:
  format-validate:
    if: startsWith(github.head_ref, 'fix/obour-alazma-dart-format')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format the five files identified by CI
        run: dart format lib/backup_service.dart lib/backup_view.dart lib/main.dart lib/manager_requests.dart lib/test_builder.dart
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/backup_service.dart lib/backup_view.dart lib/main.dart lib/manager_requests.dart lib/test_builder.dart
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Automated tests
        run: flutter test --no-pub
      - name: Prepare Android platform files
        run: |
          flutter create --project-name lamin_school --org com.adreemk.school --platforms android .
          rm -f test/widget_test.dart
      - name: Configure Android release build
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/res/values/lamin_launcher.xml <<'EOF'
          <resources><color name="lamin_launcher_background">#155D4A</color></resources>
          EOF
          cat > android/app/src/main/res/drawable/ic_lamin_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFFFF" android:pathData="M8,35 L54,17 L100,35 L54,53 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M28,44 L28,61 C43,72 65,72 80,61 L80,44 L54,55 Z"/>
            <path android:fillColor="#FFD7B56D" android:pathData="M27,70 C37,64 45,66 54,72 C63,66 71,64 81,70 L81,82 C70,76 62,78 54,84 C46,78 38,76 27,82 Z"/>
            <path android:fillColor="#FFD7B56D" android:pathData="M91,38 L96,41 L95,54 L91,56 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/lamin_launcher_background"/><foreground android:drawable="@drawable/ic_lamin_launcher_foreground"/></adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/lamin_launcher_background"/><foreground android:drawable="@drawable/ic_lamin_launcher_foreground"/></adaptive-icon>
          EOF
          sed -i 's/android:label="[^"]*"/android:label="لامين"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_BIOMETRIC' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/adreemk/school/lamin_school
          cat > android/app/src/main/kotlin/com/adreemk/school/lamin_school/MainActivity.kt <<'EOF'
          package com.adreemk.school.lamin_school
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity : FlutterFragmentActivity()
          EOF
      - name: Verify Google Drive OAuth configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: test -n "$GOOGLE_SERVER_CLIENT_ID"
      - name: Build candidate APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Commit formatted Dart files
        run: |
          if ! git diff --quiet -- lib/backup_service.dart lib/backup_view.dart lib/main.dart lib/manager_requests.dart lib/test_builder.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/backup_service.dart lib/backup_view.dart lib/main.dart lib/manager_requests.dart lib/test_builder.dart
            git commit -m "style: format Dart files for recovery build"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
