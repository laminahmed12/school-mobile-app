name: Lamin validation only
on:
  push:
    branches: [lamin-hardening-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lamin-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources in the temporary runner workspace
        run: dart format lib
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
