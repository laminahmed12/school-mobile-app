name: Lamin Dart validation (no release)

on:
  push:
    branches:
      - review/lamin-db-schema-baseline-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Format, analyze, and test (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
      - name: Resolve dependencies
        id: dependencies
        run: flutter pub get
      - name: Verify Dart formatting without modifying the checkout
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Run tests even when static analysis reports issues
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter test --no-pub
