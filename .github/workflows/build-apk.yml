name: Build Noor Al-Ajyal APK v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name noor_alajyal --org com.adreemk.school --platforms android .
      - run: sed -i 's/android:label="[^"]*"/android:label="نور الأجيال"/' android/app/src/main/AndroidManifest.xml
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: noor-alajyal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
