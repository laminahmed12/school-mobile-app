name: Build Lamin APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name lamin_school --org com.adreemk.school --platforms android .
      - run: |
          sed -i 's/android:label="[^"]*"/android:label="لامين"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_BIOMETRIC' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          cat > android/app/src/main/kotlin/com/adreemk/school/lamin_school/MainActivity.kt <<'EOF'
          package com.adreemk.school.lamin_school
          
          import io.flutter.embedding.android.FlutterFragmentActivity
          
          class MainActivity : FlutterFragmentActivity()
          EOF
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Android emulator smoke test
        continue-on-error: true
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -n com.adreemk.school.lamin_school/.MainActivity
            sleep 12
            adb shell pidof com.adreemk.school.lamin_school
            adb shell uiautomator dump /sdcard/window.xml
            adb shell am force-stop com.adreemk.school.lamin_school

      - uses: actions/upload-artifact@v4
        with:
          name: lamin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
