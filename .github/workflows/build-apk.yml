name: Verify Lamin (No Release Build)
on:
  push:
    branches: [main, "plan/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lamin-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Dart sources before verification
        run: dart format lib test
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run automated tests
        run: flutter test
      # Deliberately no APK build or release artifact during implementation.
