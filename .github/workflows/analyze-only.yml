name: Lamin Analysis Only
on:
  push:
    branches:
      - plan/lamin-finance-rollover-hardening
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lamin-analysis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
