name: Lamin RPC security ACL regression
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lamin-rpc-acl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpc-acl-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: lamin_rpc_acl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lamin_rpc_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: lamin_rpc_acl_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create test-only Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/baselines/20261015/test_bootstrap.sql
      - name: Build disposable baseline schema
        run: |
          set -euo pipefail
          for f in \
            supabase/baselines/20261015/0001_tables_sequences.sql \
            supabase/baselines/20261015/0002_private_routines.sql \
            supabase/baselines/20261015/0003_public_routines_a_d.sql \
            supabase/baselines/20261015/0004_public_routines_execute_export.sql \
            supabase/baselines/20261015/0005_public_routines_export_lamin.sql \
            supabase/baselines/20261015/0006_public_routines_validation.sql \
            supabase/baselines/20261015/0007_public_routines_rollover_finance.sql \
            supabase/baselines/20261015/0008_public_routines_restore.sql \
            supabase/baselines/20261015/0009_public_routines_remaining.sql \
            supabase/baselines/20261015/0010_defaults_constraints_indexes_views.sql \
            supabase/baselines/20261015/0011_security_policies_triggers_grants.sql \
            supabase/baselines/20261015/0012_repo_drift_reconciliation.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Move RPC implementations behind private wrappers
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015200000_harden_security_definer_rpc.sql
      - name: Apply final RPC entrypoint security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016110000_secure_private_rpc_entrypoints.sql
      - name: Assert RPC ACL boundaries
        run: psql -v ON_ERROR_STOP=1 -f test/sql/validate_rpc_entrypoint_acl.sql
      - name: Run tenant, finance, idempotency, backup and restore acceptance after security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/baselines/20261015/validate_baseline.sql
      - name: Assert negative authorization and cross-tenant write protections
        run: psql -v ON_ERROR_STOP=1 -f test/sql/validate_rpc_functional_security.sql
